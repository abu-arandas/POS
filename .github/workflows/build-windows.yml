# Builds the native Windows installer (.exe) for EA POS on GitHub's own
# windows-latest runner, which has the unrestricted internet access
# electron-builder needs to fetch the Electron runtime + NSIS/winCodeSign
# toolchain. The finished installer is uploaded as a workflow artifact and,
# when the token allows, published as a GitHub Release asset for direct download.

name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      signing_configured: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code-signing configuration
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host "::warning::Windows Release publication is disabled because the code-signing certificate secrets are not configured. The workflow artifact will be unsigned."
          }

      - name: Build renderer (Vite)
        run: npm run build

      - name: Package Windows installer (electron-builder)
        env:
          # When a code-signing certificate is provided as repository secrets the
          # installer is signed automatically — this is what stops Windows
          # SmartScreen from warning (immediately with an EV cert, or as
          # reputation builds with an OV cert). Unsigned builds remain available
          # only as workflow artifacts; public Releases require signature verification.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Verify installer signature
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\\EA-POS-Setup-*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Installer was not produced." }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: List build output
        shell: bash
        run: ls -la release/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EA-POS-Windows-Installer
          path: |
            release/EA-POS-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  publish-release:
    if: github.event_name != 'pull_request' && needs.build-windows.outputs.signing_configured == 'true'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: EA-POS-Windows-Installer
          path: release

      - name: Publish GitHub release with installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="win-build-${{ github.run_number }}"
          shopt -s nullglob
          assets=(release/EA-POS-Setup-*.exe release/latest.yml release/*.blockmap)
          if (( ${#assets[@]} < 2 )); then
            echo "::error::Missing installer or Electron update metadata in release/."
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EA POS Windows Installer (build ${{ github.run_number }})" \
            --notes "Automated signed Windows installer built from ${GITHUB_SHA}. The public Release includes the installer, latest.yml, and blockmap metadata required by electron-updater. Authenticode signature verification succeeded. See docs/windows-install.md for certificate configuration." \
          || echo "::warning::Release publish skipped (token lacks contents:write). Download the installer from this run's artifacts instead."
